<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="../static/style.css"
      th:href="@{/style.css}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous" />

    <title>Paint</title>
  </head>

  <body>
    <canvas
      id="canvas"
      width="800"
      height="800"
      class="mt-5"></canvas>

    <div
      class="container mt-5"
      id="figuras">
      <button
        type="button"
        class="btn-icon"
        aria-label="Magic"
        id="boton-cuadrado">
        <i class="bi bi-square"></i>
      </button>

      <button
        type="button"
        class="btn-solid theme-primary btn-icon"
        aria-label="Confirm">
        <svg
          class="bi"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true">
          <use href="#check2"></use>
        </svg>
      </button>

      <button
        type="button"
        class="btn-outline theme-secondary btn-icon"
        aria-label="Auto theme">
        <svg
          class="bi"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true">
          <use href="#circle-half"></use>
        </svg>
      </button>

      <button
        type="button"
        class="btn-subtle theme-warning btn-icon"
        aria-label="Light theme">
        <svg
          class="bi"
          width="16"
          height="16"
          fill="currentColor"
          aria-hidden="true">
          <use href="#sun-fill"></use>
        </svg>
      </button>

      <h4 id="titulo-figura"></h4>

      <div id="form"></div>
    </div>

    <div id="lista-canvas">
      <p class="d-inline-flex gap-1">
        <button
          class="btn-solid theme-primary"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu-canvas"
          aria-expanded="false"
          aria-controls="menu-canvas">
          Selecciona un canvas...
        </button>
      </p>

      <div
        class="collapse"
        id="menu-canvas">
        <div class="card card-body">
          <div class="menu-header">Mis canvas</div>
          <a
            class="menu-item lista-canvas"
            th:each="canva : ${todosLosCanvasUsuario}"
            th:text="${canva.nombre}"
            th:href="@{'/paint/' + ${canva.id}}"
            th:attr="data-id=${canva.id}">
            Nombre canvas
          </a>

          <div class="menu-header">Otros canvas</div>

          <a
            class="menu-item lista-canvas"
            th:each="canva : ${todosLosCanvas}"
            th:attr="data-id=${canva.id}"
            th:href="@{'/paint/' + ${canva.id}}"
            th:text="${canva.nombre}">
            Nombre canvas
          </a>
        </div>
      </div>

      <div th:if="${esEditor}">
        <button
          type="button"
          id="editar-canvas">
          Editar
        </button>
        <form th:action="@{'/paint/eliminarCanvas/'+ ${canvasSeleccionado.id}}" method="post">
        <button
          type="submit"
          id="eliminar-canvas">Eliminar</button>
          </form>
      </div>
    </div>

    <script
      type="module"
      src="../static/script.js"
      th:src="@{/script.js}"></script>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"></script>
  <script id="datosFiguras" type="application/json" th:text="${figurasJson}"></script>
  </body>
</html>
