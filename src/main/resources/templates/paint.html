
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../static/style.css" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Paint</title>
</head>

<body>

    <canvas id="canvas" width="800" height="800" class="mt-5"></canvas>

    <div class="container mt-5" id="figuras">

        <button type="button" class="btn-icon" aria-label="Magic" id="boton-cuadrado">
            <i class="bi bi-square"></i>
        </button>

        <button type="button" class="btn-solid theme-primary btn-icon" aria-label="Confirm">
            <svg class="bi" width="16" height="16" fill="currentColor" aria-hidden="true">
                <use href="#check2"></use>
            </svg>
        </button>

        <button type="button" class="btn-outline theme-secondary btn-icon" aria-label="Auto theme">
            <svg class="bi" width="16" height="16" fill="currentColor" aria-hidden="true">
                <use href="#circle-half"></use>
            </svg>
        </button>

        <button type="button" class="btn-subtle theme-warning btn-icon" aria-label="Light theme">
            <svg class="bi" width="16" height="16" fill="currentColor" aria-hidden="true">
                <use href="#sun-fill"></use>
            </svg>
        </button>

        <h4 id="titulo-figura"></h4>

        <div id="form">
        </div>

    </div>

    <div id="lista-canvas">

    <p class="d-inline-flex gap-1">
        <button class="btn-solid theme-primary"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu-canvas"
                aria-expanded="false"
                aria-controls="menu-canvas">
            Selecciona un canvas...
        </button>
    </p>

    <div class="collapse" id="menu-canvas">
        <div class="card card-body">

            <div class="menu-header">Mis canvas</div>

            <button class="menu-item"
                    type="button"
                    th:each="canva : ${todosLosCanvasUsuario}"
                    th:text="${canva.nombre}"
                    th:id="${canva.id}">
                Nombre canvas
            </button>

            <div class="menu-header">Otros canvas</div>

            <button class="menu-item"
                    type="button"
                    th:each="canva : ${todosLosCanvas}"
                    th:unless="${canva.idUser == idUser}"
                    th:text="${canva.nombre}"
                    th:id="${canva.id}">
                Nombre canvas
            </button>

        </div>
    </div>

</div>
    




    <script type="module" src="../static/script.js" th:src="@{/script.js}"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            crossorigin="anonymous">
    </script>

</body>
</html>
