<!doctype html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paint</title>

  <link rel="stylesheet" th:href="@{/style.css}" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
    crossorigin="anonymous" />
</head>

<body>

  <nav id="navegacion" class="d-flex justify-content-end align-items-center gap-2">
  <button type="button" id="boton-mis-canvas" class="boton-nav activa">
    <i class="bi bi-collection"></i> Mis canvas
  </button>
  <button type="button" id="boton-otros-canvas" class="boton-nav">
    <i class="bi bi-globe"></i> Otros canvas
  </button>
  <form th:action="@{/logout}" method="post">
    <button type="submit" class="boton-nav activa">
      <i class="bi bi-box-arrow-right"></i> Logout
    </button>
  </form>
</nav>

  <canvas id="canvas" width="800" height="800"></canvas>

  <div id="canvas-datos"
       th:if="${canvasSeleccionado != null}"
       th:attr="data-id=${canvasSeleccionado.id}, data-nombre=${canvasSeleccionado.nombre}"></div>

  <div id="figuras" class="panel">
    <h4>Figuras</h4>

    <div th:if="${esEditor}" class="d-flex flex-wrap gap-2 mb-3">
     <button type="button" class="boton-nav" aria-label="Cuadrado" id="boton-cuadrado" data-tipo="Cuadrado">
  <i class="bi bi-square-fill"></i>
</button>
<button type="button" class="boton-nav" aria-label="Triangulo" id="boton-triangulo" data-tipo="Triangulo">
  <i class="bi bi-triangle-fill"></i>
</button>
<button type="button" class="boton-nav" aria-label="Circulo" id="boton-circulo" data-tipo="Circulo">
  <i class="bi bi-circle-fill"></i>
</button>
<button type="button" class="boton-nav" aria-label="Estrella" id="boton-estrella" data-tipo="Estrella">
  <i class="bi bi-star-fill"></i>
</button>
<button type="button" class="boton-nav" aria-label="Trazado" id="boton-trazado" data-tipo="Trazado">
  <i class="bi bi-pencil-fill"></i>
</button>
    </div>

    <h4 id="titulo-figura"></h4>

    <ul id="lista-figuras"></ul>

   <div id="form" class="d-flex flex-column gap-3"></div>
    <div id="form-editar" class="d-flex flex-column gap-3"></div>

    <div th:if="${esEditor}" class="d-flex gap-2 mt-4">
      <button type="button" id="boton-editar-figura" class="boton-nav">Editar figura</button>
      <button type="button" id="boton-borrar-figura" class="boton-nav">Borrar figura</button>
      <button type="button" id="boton-borrar-todo" class="boton-nav">Borrar todo</button>
    </div>
    </div>

 <div id="derecha">

  <div id="panel-canvas" class="panel">
    <h4>Canvas</h4>

    <a th:href="@{/paint/nuevo}" class="boton-nav mb-2">Nuevo canvas</a>

    <form id="form-guardar"
          th:if="${esEditor}"
          th:action="@{'/paint/' + ${canvasSeleccionado.id} + '/guardar'}"
          method="post">
            <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control mb-2" id="nombre" name="nombre"
             th:value="${canvasSeleccionado.nombre}">
      <input type="hidden" id="figurasGuardar" name="figuras">
      <input type="hidden" id="numObjetos" name="numObjetos">
      <button type="submit" class="boton-nav activa">Guardar canvas</button>
    </form>

    <div th:if="${esEditor}" class="mt-2 d-flex gap-2">
      <button type="button" id="editar-canvas" class="boton-nav">Editar</button>
      <form th:action="@{'/paint/eliminarCanvas/'+ ${canvasSeleccionado.id}}" method="post">
        <button type="submit" id="eliminar-canvas" class="boton-nav">Eliminar</button>
      </form>
    </div>
  </div>

  <div id="lista-canvas" class="panel">
    <h4>Canvas</h4>

    <div id="lista-mis-canvas">
      <h3 class="menu-header titulo-lista" >Mis canvas</h3>
      <a class="menu-item lista-canvas d-block"
         th:each="canva : ${todosLosCanvasUsuario}"
         th:text="${canva.nombre}"
         th:href="@{'/paint/' + ${canva.id}}"
         th:attr="data-id=${canva.id}">Nombre canvas</a>
    </div>

   <div id="lista-otros-canvas" th:style="'display:none'">
  <div class="menu-header">Otros canvas</div>
  <a class="menu-item lista-canvas d-block"
     th:each="canva : ${todosLosCanvas}"
     th:if="${canva.idUser != idUser}"
     th:text="${canva.nombre}"
     th:href="@{'/paint/' + ${canva.id}}"
     th:attr="data-id=${canva.id}">Nombre canvas</a>
</div>
  </div>

</div>
  <div id="historial" class="panel">
    
  </div>

  

  <script id="datosFiguras" type="application/json" th:utext="${figurasJson}">[]</script>
  <script type="module" th:src="@{/script.js}"></script>
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

</body>
</html>
