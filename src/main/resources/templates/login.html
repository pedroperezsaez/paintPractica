<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link rel="stylesheet" th:href="@{/style.css}" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    rel="stylesheet" />
</head>
<body class="pagina-acceso">

  <nav id="navegacion" class="d-flex justify-content-end gap-2">
  <a th:href="@{/}" class="boton-nav activa">
    <i class="bi bi-box-arrow-in-right"></i> Login
  </a>
  <a th:href="@{/register}" class="boton-nav">
    <i class="bi bi-person-plus"></i> Register
  </a>
</nav>

  <main>
    <div class="panel">
      <div class="boton-nav activa mb-3">
        <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
      </div>

      <p th:if="${message}" th:text="${message}" class="mensaje-error"></p>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="username" name="username" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" />
        </div>
        <button type="submit" class="boton-nav activa">Entrar</button>
      </form>
    </div>
  </main>

</body>
</html>
